name: Verify and deploy VIP

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # VERIFICAR BACKEND
  # El backend real se ejecuta en Render.
  # Aquí solamente comprobamos que el código compile y pase tests.
  # ============================================================

  backend:
    name: Verify backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Install backend dependencies
        run: npm install --include=dev

      - name: Typecheck backend
        run: npm run typecheck

      - name: Test backend
        run: npm test

      - name: Build backend
        run: npm run build


  # ============================================================
  # CONSTRUIR FRONTEND
  # Este frontend se publica en GitHub Pages.
  # Se comunica con el backend de Render.
  # ============================================================

  frontend:
    name: Build static frontend
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://vip-teleconsulta-api.onrender.com

    defaults:
      run:
        working-directory: examenes-ocupacionales

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Validate Render API URL
        shell: bash
        run: |
          echo "Backend configurado:"
          echo "$NEXT_PUBLIC_API_URL"

          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_URL está vacío."
            exit 1
          fi

          case "$NEXT_PUBLIC_API_URL" in
            https://*)
              echo "URL HTTPS válida."
              ;;
            *)
              echo "::error::NEXT_PUBLIC_API_URL debe comenzar con https://"
              exit 1
              ;;
          esac

      - name: Install frontend dependencies
        run: npm install --include=dev

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build static frontend
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examenes-ocupacionales/out


  # ============================================================
  # PUBLICAR EN GITHUB PAGES
  # ============================================================

  deploy:
    name: Deploy GitHub Pages

    if: github.event_name != 'pull_request'

    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
